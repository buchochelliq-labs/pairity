bundle:
  name: pairity-workbench

variables:
  app_name:
    description: Unique lowercase Databricks App name
    default: pairity-workbench
  warehouse_name:
    description: Existing warehouse name; override if renamed in the workspace
    default: Serverless Starter Warehouse
  warehouse_id:
    description: Resolved warehouse ID; an explicit variable override bypasses lookup
    lookup:
      warehouse: ${var.warehouse_name}
  job_id:
    description: Existing Pairity regression Job ID
  result_table:
    description: Existing catalog.schema.results Delta table
  artifact_root:
    description: Existing /Volumes/catalog/schema/volume/prefix
  lakebase_project_id:
    description: Lakebase project managed by this bundle (Free Edition allows one project)
    default: pairity-state
  postgres_schema:
    default: pairity

resources:
  postgres_projects:
    state:
      project_id: ${var.lakebase_project_id}
      display_name: Pairity application state
      pg_version: 17
      default_endpoint_settings:
        autoscaling_limit_min_cu: 0.5
        autoscaling_limit_max_cu: 0.5
        suspend_timeout_duration: 300s
      lifecycle:
        prevent_destroy: true
  apps:
    workbench:
      name: ${var.app_name}
      description: Pairity configuration, parallel regression runs and incident evidence
      source_code_path: ./build
      # Only selectable App user scopes. Identity defaults are platform-managed.
      # Jobs calls use the App identity behind an explicit caller Job-ACL check.
      user_api_scopes:
        - sql
      resources:
        - name: runner
          job:
            id: ${var.job_id}
            permission: CAN_MANAGE_RUN
        - name: warehouse
          sql_warehouse:
            id: ${var.warehouse_id}
            permission: CAN_USE
        - name: postgres
          postgres:
            branch: ${resources.postgres_projects.state.name}/branches/production
            database: ${resources.postgres_projects.state.name}/branches/production/databases/databricks-postgres
            permission: CAN_CONNECT_AND_CREATE
      config:
        command: [python, -c, 'from pairity.web.bootstrap import main; main()']
        env:
          - name: PAIRITY_APP_MODE
            value: databricks
          - name: PAIRITY_JOB_ID
            value: ${var.job_id}
          - name: PAIRITY_SQL_WAREHOUSE_ID
            value: ${var.warehouse_id}
          - name: PAIRITY_RESULT_TABLE
            value: ${var.result_table}
          - name: PAIRITY_ARTIFACT_ROOT
            value: ${var.artifact_root}
          - name: PAIRITY_POSTGRES_SCHEMA
            value: ${var.postgres_schema}
          - name: PAIRITY_DATABASE_AUTH
            value: lakebase
          - name: PAIRITY_LAKEBASE_ENDPOINT
            value: ${resources.postgres_projects.state.name}/branches/production/endpoints/primary

targets:
  workspace:
    default: true
    variables:
      # Existing Free Edition runner, verified by smoke run 41833551263.
      # Update if the regression bundle is destroyed/recreated; this is not a run ID.
      job_id: "656591313118833"
