name: Deploy Pairity workbench

on:
  workflow_dispatch:
    inputs:
      logs_only:
        description: Read current App logs without deploying or restarting
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: pairity-workbench-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: Databricks-free
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install App dependencies for Lakebase access check
        if: ${{ !inputs.logs_only }}
        run: python -m pip install -r app/requirements.txt
      - uses: actions/setup-node@v4
        if: ${{ !inputs.logs_only }}
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/ui/package-lock.json
      - run: npm ci && npm test && npm run build
        if: ${{ !inputs.logs_only }}
        working-directory: app/ui
      - run: python scripts/build_app.py
        if: ${{ !inputs.logs_only }}
      - name: Install pinned Databricks CLI
        run: |
          curl --fail --silent --show-error --location \
            https://github.com/databricks/cli/releases/download/v1.23.0/databricks_cli_1.23.0_linux_amd64.zip \
            --output "$RUNNER_TEMP/databricks.zip"
          unzip -q "$RUNNER_TEMP/databricks.zip" -d "$RUNNER_TEMP/databricks-cli"
          chmod +x "$RUNNER_TEMP/databricks-cli/databricks"
          echo "$RUNNER_TEMP/databricks-cli" >> "$GITHUB_PATH"
      - name: Deploy App or read runtime logs
        working-directory: app
        env:
          DATABRICKS_CONFIG_FILE: ${{ github.workspace }}/.github/databrickscfg
          DATABRICKS_CONFIG_PROFILE: pairity-app-ci
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_AUTH_TYPE: oauth-m2m
          DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
          DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
          BUNDLE_VAR_result_table: ${{ secrets.PAIRITY_RESULT_TABLE }}
          BUNDLE_VAR_artifact_root: ${{ secrets.PAIRITY_ARTIFACT_ROOT }}
          PAIRITY_LOGS_ONLY: ${{ inputs.logs_only }}
        run: |
          python - <<'PY'
          import os
          required = ['DATABRICKS_HOST', 'DATABRICKS_CLIENT_ID', 'DATABRICKS_CLIENT_SECRET',
                      'BUNDLE_VAR_result_table', 'BUNDLE_VAR_artifact_root']
          missing = [name for name in required if not os.environ.get(name)]
          if missing:
              raise SystemExit('Missing environment secrets for: ' + ', '.join(missing))
          PY
          if [[ "$PAIRITY_LOGS_ONLY" == "true" ]]; then
            # CLI bundle discovery checks this local path even when only reading logs.
            mkdir -p build
            timeout 60s databricks apps logs --target workspace --tail-lines 200
            exit 0
          fi
          databricks bundle validate --target workspace
          databricks bundle deploy --target workspace
          databricks bundle summary --target workspace --output json > "$RUNNER_TEMP/pairity-bundle.json"
          PYTHONPATH=../src timeout 120s python -m pairity.web.lakebase_check "$RUNNER_TEMP/pairity-bundle.json"
          if databricks bundle run --target workspace workbench; then
            exit 0
          else
            deployment_status=$?
            echo 'App startup failed; collecting the last 200 runtime log lines.'
            timeout 60s databricks apps logs --target workspace --tail-lines 200 || \
              echo 'Runtime log collection failed; open the App Logs tab in Databricks.'
            exit "$deployment_status"
          fi
