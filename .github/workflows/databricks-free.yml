name: Databricks Free Edition smoke tests

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: pairity-databricks-free
  cancel-in-progress: false

jobs:
  deploy-and-test:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: Databricks-free
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev,databricks]'
      - name: Install pinned Databricks CLI
        run: |
          curl --fail --silent --show-error --location \
            https://github.com/databricks/cli/releases/download/v1.23.0/databricks_cli_1.23.0_linux_amd64.zip \
            --output "$RUNNER_TEMP/databricks.zip"
          unzip -q "$RUNNER_TEMP/databricks.zip" -d "$RUNNER_TEMP/databricks-cli"
          chmod +x "$RUNNER_TEMP/databricks-cli/databricks"
          echo "$RUNNER_TEMP/databricks-cli" >> "$GITHUB_PATH"
      - name: Validate, deploy and test exact checkout
        env:
          DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST || secrets.DATABRICKS_HOST }}
          DATABRICKS_AUTH_TYPE: ${{ vars.DATABRICKS_AUTH_TYPE || 'oauth-m2m' }}
          DATABRICKS_TOKEN: ${{ vars.DATABRICKS_AUTH_TYPE == 'pat' && secrets.DATABRICKS_TOKEN || '' }}
          DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID || vars.DATABRICKS_CLIENT_ID }}
          DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
          PAIRITY_CATALOG: ${{ vars.PAIRITY_CATALOG }}
          PAIRITY_SCHEMA: ${{ vars.PAIRITY_SCHEMA }}
          PAIRITY_ARTIFACT_ROOT: ${{ vars.PAIRITY_ARTIFACT_ROOT }}
          PAIRITY_RESULT_TABLE: ${{ vars.PAIRITY_RESULT_TABLE }}
        run: |
          python scripts/databricks_preflight.py
          export BUNDLE_VAR_test_catalog="$PAIRITY_CATALOG"
          export BUNDLE_VAR_test_schema="$PAIRITY_SCHEMA"
          export BUNDLE_VAR_artifact_root="$PAIRITY_ARTIFACT_ROOT"
          export BUNDLE_VAR_result_table="$PAIRITY_RESULT_TABLE"
          export BUNDLE_VAR_config_path="$PAIRITY_ARTIFACT_ROOT/unused-until-smoke-setup.yaml"
          export BUNDLE_VAR_parallel_pairs=2
          export BUNDLE_VAR_retain_differences=false
          databricks bundle validate --target free_test
          databricks bundle deploy --target free_test
          databricks bundle summary --target free_test --output json > "$RUNNER_TEMP/pairity-bundle.json"
          python scripts/databricks_smoke.py \
            --summary "$RUNNER_TEMP/pairity-bundle.json" \
            --test-id "gha_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}" \
            --artifact-root "$PAIRITY_ARTIFACT_ROOT"
      - name: Upload synthetic evidence and Job links
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pairity-databricks-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: smoke-output/
          if-no-files-found: ignore
          retention-days: 14
