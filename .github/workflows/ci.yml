name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pairity
          POSTGRES_PASSWORD: pairity_test_only
          POSTGRES_DB: pairity
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pairity"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: python -m pip install -e '.[dev,postgres,databricks]' 'pyspark==3.5.8' 'delta-spark==3.3.2'
      - run: ruff check src tests examples/tuva scripts notebooks
      - run: ruff format --check src tests examples/tuva scripts notebooks
      - run: python -m pytest
        env:
          SPARK_LOCAL_IP: 127.0.0.1
          PAIRITY_TEST_DELTA: '1'
          PAIRITY_TEST_POSTGRES_DSN: postgresql://pairity:pairity_test_only@localhost:5432/pairity
      - run: python -m build
      - run: pairity --json validate examples/suite.yaml
      - run: pairity --json validate examples/suite.json
      - run: pairity --json validate examples/tuva/tuva-regression.yaml
      - run: pairity --json validate examples/tuva/tuva-identical.json
