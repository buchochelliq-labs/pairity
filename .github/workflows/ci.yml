name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: python -m pip install -e '.[dev]' 'pyspark==3.5.8'
      - run: ruff check src tests
      - run: ruff format --check src tests
      - run: python -m pytest
        env:
          SPARK_LOCAL_IP: 127.0.0.1
      - run: python -m build
      - run: pairity --json validate examples/suite.yaml
      - run: pairity --json validate examples/suite.json
